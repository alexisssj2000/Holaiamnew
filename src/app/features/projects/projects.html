<section class="projects-section">
  <h2 class="section-title">Projects</h2>

  <div class="projects-carousel" 
       #carousel 
       (mouseenter)="pauseScroll()" 
       (mouseleave)="startScroll()">
    
    @for (project of projects; track project._id) {
      <a [href]="project.url" target="_blank" class="project-card">
        <div class="image-wrapper">
          <img [src]='getImageUrl(project.img)' [alt]="project.name">
        </div>
        <div class="card-content">
          <h3 class="card-title">{{ project.name }}</h3>
          <h4 class="card-subtitle">{{ project.type }}</h4>
          <p class="card-desc">{{ project.description }}</p>
        </div>
      </a>
    } @empty {
      <p style="color: #a1a1aa;">Conectando con el servidor y cargando proyectos...</p>
    }

  </div>
</section>
